name: Recurring payments

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 IST (cron runs in UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recurring run
        env:
          API_URL: ${{ secrets.API_URL }}
          SECRET: ${{ secrets.RECURRING_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$API_URL/api/internal/recurring/run" \
            -H "x-cron-secret: $SECRET"
